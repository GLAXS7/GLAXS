<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLAXS Universe</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- JUEGO -->
<canvas id="space"></canvas>

<!-- PORTADA -->
<div id="intro">

    <div class="center">

        <div class="alienIcon">👽</div>

        <h1>GLAXS</h1>

        <p>Explora • Descubre • Conquista</p>

        <button id="startBtn">
            🚀 INICIAR MISIÓN
        </button>

    </div>

</div>

<!-- HUD -->
<div id="hud">

    <div>
        💎 Cristales:
        <span id="score">0</span>
    </div>

    <div>
        ❤️ Vidas:
        <span id="lives">3</span>
    </div>

</div>

<!-- CONTROLES -->
<div id="controls">
    ⌨️ Usa las flechas ← ↑ → ↓ para mover el OVNI
</div>

<script src="script.js"></script>

</body>
</html>
