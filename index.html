<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLAXS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<h1 class="logo">
<span class="g">G</span>
<span class="l">L</span>
<span class="a">A</span>
<span class="x">X</span>
<span class="s">S</span>
</h1>

<p class="subtitle">
💎 Recoge las gemas y evita al perseguidor rojo 💎
</p>

<div class="card">

<div class="ui">
<div>Nivel: <span id="level">1</span></div>
<div>Puntos: <span id="score">0</span></div>
</div>

<canvas id="game"></canvas>

<div id="gameover">
<h2>💀 GAME OVER 💀</h2>
<p>El enemigo te atrapó.</p>
<button onclick="location.reload()">
Jugar otra vez
</button>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
