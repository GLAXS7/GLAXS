<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLAXS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050816;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    top:0;
    left:0;
}

.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
}

h1{
    color:white;
    font-size:5rem;
    letter-spacing:8px;
    text-shadow:0 0 20px #00ffff;
    animation: glow 2s infinite alternate;
}

p{
    color:#aaa;
    margin-top:15px;
    font-size:1.2rem;
}

button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:#00ffff;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px cyan;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px cyan;
    }
    to{
        text-shadow:0 0 40px cyan;
    }
}
</style>
</head>
<body>

<canvas id="space"></canvas>

<div class="container">
    <h1>GLAXS</h1>
    <p>Bienvenido al universo digital</p>
    <button onclick="entrar()">ENTRAR</button>
</div>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [];

for(let i=0;i<250;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*2,
        speed:Math.random()*2+0.5
    });
}

function animate(){
    ctx.fillStyle="#050816";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";

    stars.forEach(star=>{
        ctx.beginPath();
        ctx.arc(star.x,star.y,star.size,0,Math.PI*2);
        ctx.fill();

        star.y += star.speed;

        if(star.y > canvas.height){
            star.y = 0;
            star.x = Math.random()*canvas.width;
        }
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

function entrar(){
    alert("Bienvenido a GLAXS 🚀");
}
</script>

</body>
</html>
