<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLAXS Universe</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#020617;
font-family:Segoe UI,Arial,sans-serif;
}

canvas{
position:fixed;
top:0;
left:0;
}

.overlay{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
pointer-events:none;
}

.logo{
font-size:clamp(70px,10vw,170px);
font-weight:900;
color:white;
letter-spacing:12px;

text-shadow:
0 0 10px #00ffff,
0 0 30px #00ffff,
0 0 60px #00ffff,
0 0 120px #00ffff;

animation:pulse 4s infinite;
}

.subtitle{
margin-top:10px;
font-size:1.3rem;
color:#cbd5e1;
letter-spacing:3px;
}

.enter{
margin-top:40px;
pointer-events:auto;
cursor:pointer;

padding:18px 60px;

border:none;
border-radius:999px;

font-size:1.2rem;
font-weight:700;

background:linear-gradient(
45deg,
#00ffff,
#2563eb
);

color:white;

box-shadow:
0 0 20px #00ffff,
0 0 60px #00ffff;

transition:.4s;
}

.enter:hover{
transform:scale(1.1);
box-shadow:
0 0 40px #00ffff,
0 0 100px #00ffff;
}

@keyframes pulse{

50%{
transform:scale(1.05);
}

}

.info{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
color:#94a3b8;
font-size:.9rem;
z-index:10;
}

</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="overlay">

<div class="logo">GLAXS</div>

<div class="subtitle">
EXPLORA EL UNIVERSO DIGITAL
</div>

<button class="enter" onclick="launch()">
🚀 ENTRAR
</button>

</div>

<div class="info">
✨ Sistema Espacial Interactivo
</div>

<script>

const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}

resize();
window.addEventListener("resize",resize);

const stars=[];

for(let i=0;i<1800;i++){

stars.push({

x:(Math.random()-0.5)*2000,
y:(Math.random()-0.5)*2000,
z:Math.random()*2000

});

}

const meteors=[];

for(let i=0;i<10;i++){

meteors.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
speed:10+Math.random()*10

});

}

let orbit=0;

function drawNebula(){

const g=ctx.createRadialGradient(
canvas.width*0.2,
canvas.height*0.3,
50,
canvas.width*0.2,
canvas.height*0.3,
500
);

g.addColorStop(0,"rgba(0,255,255,.15)");
g.addColorStop(1,"rgba(0,0,0,0)");

ctx.fillStyle=g;
ctx.fillRect(0,0,canvas.width,canvas.height);

}

function drawStars(){

stars.forEach(s=>{

s.z-=6;

if(s.z<=1){

s.x=(Math.random()-0.5)*2000;
s.y=(Math.random()-0.5)*2000;
s.z=2000;

}

const k=400/s.z;

const x=s.x*k+canvas.width/2;
const y=s.y*k+canvas.height/2;

if(
x<0||
x>canvas.width||
y<0||
y>canvas.height
)return;

const size=(1-s.z/2000)*4;

ctx.fillStyle="white";
ctx.fillRect(x,y,size,size);

});

}

function drawPlanet(){

const x=canvas.width-250;
const y=220;

const grad=ctx.createRadialGradient(
x-40,
y-40,
20,
x,
y,
170
);

grad.addColorStop(0,"#67e8f9");
grad.addColorStop(.4,"#2563eb");
grad.addColorStop(1,"#020617");

ctx.beginPath();
ctx.arc(x,y,150,0,Math.PI*2);
ctx.fillStyle=grad;
ctx.fill();

ctx.strokeStyle="rgba(255,255,255,.15)";
ctx.lineWidth=8;

ctx.beginPath();
ctx.arc(x,y,180,0,Math.PI*2);
ctx.stroke();

orbit+=0.01;

const moonX=x+Math.cos(orbit)*260;
const moonY=y+Math.sin(orbit)*260;

ctx.beginPath();
ctx.arc(moonX,moonY,28,0,Math.PI*2);
ctx.fillStyle="#e5e7eb";
ctx.fill();

}

function drawMeteors(){

meteors.forEach(m=>{

ctx.strokeStyle="rgba(0,255,255,.8)";
ctx.lineWidth=2;

ctx.beginPath();
ctx.moveTo(m.x,m.y);
ctx.lineTo(m.x-80,m.y-80);
ctx.stroke();

m.x+=m.speed;
m.y+=m.speed;

if(m.x>canvas.width+200){

m.x=-300;
m.y=Math.random()*300;

}

});

}

function animate(){

ctx.fillStyle="#020617";
ctx.fillRect(0,0,canvas.width,canvas.height);

drawNebula();
drawStars();
drawPlanet();
drawMeteors();

requestAnimationFrame(animate);

}

animate();

function launch(){

document.querySelector(".enter").innerHTML="✨ CARGANDO...";

setTimeout(()=>{

document.querySelector(".subtitle").innerHTML=
"BIENVENIDO A GLAXS 🚀";

},1000);

}

</script>

</body>
</html>
